name: Publish production release from main

on:
  workflow_run:
    workflows:
      - PHP syntax checks
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: gaugeiq-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm tested commit is still main
        id: target
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
            echo "Main has moved to $MAIN_SHA; skipping release of older tested commit $TARGET_SHA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Calculate next patch release
        if: steps.target.outputs.publish == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -n 1 || true)"

          if [[ -z "$LATEST_TAG" ]]; then
            LATEST_TAG="v1.0.1"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"

          if git ls-remote --exit-code --tags origin "refs/tags/$NEXT_TAG" >/dev/null 2>&1; then
            echo "Release tag $NEXT_TAG already exists; refusing to overwrite it."
            exit 1
          fi

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $NEXT_TAG from tested commit $GITHUB_SHA"

      - name: Create published GitHub release
        if: steps.target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --target "$TARGET_SHA" \
            --title "GaugeIQ $RELEASE_TAG" \
            --notes "Automated production release built from main after all PHP syntax and regression checks passed."

          # GITHUB_TOKEN-created releases do not trigger tag-push workflows.
          # Dispatch the existing package builder explicitly after the release exists.
          gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"
