name: PHP syntax checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_sqlite, pdo_mysql, zip

      - name: Lint PHP files
        run: find app public cron bin database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check updater shell syntax
        run: bash -n cron/update-from-github.sh

      - name: Check Admin JavaScript syntax
        run: node --check public/js/admin.js

      - name: Validate web manifest JSON
        run: php -r '$manifest = json_decode(file_get_contents("public/manifest.json"), true, 512, JSON_THROW_ON_ERROR); if (!is_array($manifest)) { exit(1); }'
