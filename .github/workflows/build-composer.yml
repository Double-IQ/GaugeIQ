name: Build Composer dependencies

on:
  push:
    branches:
      - main
    # Composer writes vendor/ back to main. Ignore those generated commits so
    # the workflow does not keep rebuilding its own generated installed.php.
    paths-ignore:
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: write

# Only one dependency-build job may commit to main at a time.
concurrency:
  group: gaugeiq-composer-dependencies-main
  cancel-in-progress: false

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GaugeIQ
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Commit Composer dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Incorporate any commits that landed after this run was queued.
          git fetch origin main
          git rebase origin/main

          git add composer.lock
          git add -f vendor
          if git diff --cached --quiet; then
            echo "Composer dependencies are already up to date."
            exit 0
          fi

          git commit -m "Build Composer dependencies"

          # Retry if an unrelated commit reaches main between fetch and push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
