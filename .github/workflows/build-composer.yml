name: Build Composer dependencies

on:
  push:
    branches:
      - main
    # Rebuild dependencies only when dependency definitions change.
    # Ordinary application commits must not queue redundant vendor commits.
    paths:
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

permissions:
  contents: write

# Only one dependency-build job may commit to main at a time.
concurrency:
  group: gaugeiq-composer-dependencies-main
  cancel-in-progress: true

jobs:
  composer:
    # A generated commit may update composer.lock, so skip that commit by message.
    if: github.event_name != 'push' || github.event.head_commit.message != 'Build Composer dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Check out GaugeIQ
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Synchronise with main before installing dependencies
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Commit Composer dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage generated files only after the working tree is based on main.
          git add composer.lock
          git add -f vendor
          if git diff --cached --quiet; then
            echo "Composer dependencies are already up to date."
            exit 0
          fi

          git commit -m "Build Composer dependencies"

          # If main advances during this run, rebase the clean committed tree
          # before retrying the push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
