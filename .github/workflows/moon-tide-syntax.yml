name: Moon Tide syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/moon-tide-hud]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax check
        run: php -l public/index.php
      - name: JavaScript syntax check
        run: node --check public/js/moon-tide-hud.js
